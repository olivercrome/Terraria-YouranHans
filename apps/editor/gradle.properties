org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=true
# NOTE: the line below is Termux/phone-only. On desktop (Windows/Linux) the
# Android Gradle Plugin ships its own aapt2 binary, so this override must stay
# disabled - otherwise the build fails because that termux path does not exist.
# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
